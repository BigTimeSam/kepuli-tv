# The Xcode project, generated by xcodegen (node ios/build.mjs runs it):
# ios/KepuliTV.xcodeproj is not committed. App/ and Tests/ are globbed, so
# a new source file needs no change here. Everything under dist/ and vendor/
# is made by build.mjs and vendor.mjs before the project is generated.

name: KepuliTV
options:
  deploymentTarget:
    # On iOS 18 WebKit refuses WebAssembly in an extension page, and a film
    # with AC-3 sound is silent without the decoder the player brings.
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    CODE_SIGN_STYLE: Automatic
    # Empty on purpose: the owner's team is given on the command line and
    # never enters the repository.
    DEVELOPMENT_TEAM: ""
    # The pre-build phase below writes into dist/, which a sandboxed script may not.
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: "NO"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
    # Never -Ofast: the Cast SDK's documentation forbids it.

targets:
  KepuliTV:
    type: application
    platform: iOS
    configFiles:
      Debug: dist/Version.xcconfig
      Release: dist/Version.xcconfig
    sources:
      - path: App
      # A folder reference, not a group: the extension keeps its directories
      # (_locales/, js/locales/, vendor/) in the bundle.
      - path: dist/extension
        type: folder
        buildPhase: resources
      - path: dist/Icon.xcassets
      - path: dist/Localized
      - path: vendor/OpenSourceLicenses
        type: folder
        buildPhase: resources
    dependencies:
      - framework: vendor/GoogleCast.xcframework
        embed: true
    preBuildScripts:
      # A build started in Xcode carries the current page, and runs the Node
      # that last ran build.mjs (Homebrew's and the shell's differ here).
      # build.mjs sets KEPULI_PREPARED when it has just done this itself.
      - name: Copy the extension
        script: |
          [ "$KEPULI_PREPARED" = YES ] || "$KEPULI_NODE" "$SRCROOT/build.mjs" --extension
        basedOnDependencyAnalysis: false
    scheme:
      testTargets:
        - KepuliTVTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "NO"
        PRODUCT_BUNDLE_IDENTIFIER: io.github.bigtimesam.kepulitv
        # App/Cast/Press.m, the one Objective-C file: it catches an
        # exception, which Swift cannot.
        SWIFT_OBJC_BRIDGING_HEADER: App/Bridging.h
      configs:
        Debug:
          # Its own container beside the App Store's app.
          PRODUCT_BUNDLE_IDENTIFIER: io.github.bigtimesam.kepulitv.debug
    info:
      path: dist/Info.plist
      properties:
        CFBundleDisplayName: Kepuli-TV
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        # An iOS app and nothing else, as every app in the store says.
        LSRequiresIPhoneOS: true
        # The page's 30 languages (js/i18n.js; pt and sr spelled as iOS
        # wants them). Declaring them is also what makes the Cast SDK's
        # dialogs and the system's pickers follow the viewer's language.
        # build.mjs fails when this list and the page's differ.
        CFBundleLocalizations:
          - en
          - fi
          - sv
          - nb
          - da
          - de
          - nl
          - fr
          - es
          - pt-BR
          - it
          - pl
          - tr
          - cs
          - hu
          - ro
          - hr
          - sq
          - el
          - ru
          - uk
          - bg
          - sk
          - sl
          - sr-Latn
          - lt
          - lv
          - et
          - id
          - vi
        # A plain dark ground until the page paints; no storyboard.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Player
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        # The app follows the way the device is held, on both devices. No
        # UIRequiresFullScreen: the iPad app resizes.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Measured in the spike: without this a public host name over plain
        # http fails for fetch, MP4 and HLS in the web view. Only this key:
        # NSAllowsArbitraryLoads beside it would silently disable it.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        NSBonjourServices:
          - _googlecast._tcp
          - _CC1AD845._googlecast._tcp
        # The English sentence, from js/i18n.js by way of Version.xcconfig;
        # dist/Localized carries the other languages.
        NSLocalNetworkUsageDescription: $(KEPULI_LOCAL_NETWORK)
        # The sound of what plays goes on when the app leaves the front
        # (js/playercontrols.js), and Apple's condition for picture in
        # picture (ios/AGENTS.md, Sound and picture behind another app).
        # If the device checklist's lines on it fail, the key goes before
        # anything is submitted (store/appstore.txt).
        UIBackgroundModes:
          - audio
        ITSAppUsesNonExemptEncryption: false

  KepuliTVTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: KepuliTV
      # CastTests imports GoogleCast; the app embeds it.
      - framework: vendor/GoogleCast.xcframework
        embed: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: io.github.bigtimesam.kepulitv.tests
