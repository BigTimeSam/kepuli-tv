# docs/ as it is in the repository, put on GitHub Pages
# (https://bigtimesam.github.io/kepuli-tv/).
#
# Pages can publish a branch's directory by itself, and did until 1.14.0.
# That build is GitHub's own workflow: its runner and its actions are
# whatever GitHub gives it, and each run carried their notices (a runner
# about to change, an action on an old Node) which nothing here could
# answer. This one is pinned like the others. Nothing is built: the site is
# rendered into docs/ by dev/site.mjs and committed, and the CI's static
# checks say when it is behind.

name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer site waits for the one being put up, which is never cut short.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: The site is put up
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The only job that may publish the site: Pages takes the upload from
    # a token that proves which workflow it comes from.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
