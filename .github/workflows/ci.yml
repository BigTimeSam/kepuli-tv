# The project's tests. On every push and pull request: the checks that need
# no browser, a smoke set of the browser scenarios in Chrome and in Firefox,
# both Android packages and the iPhone and iPad app. Every night and on
# demand: the same with every browser scenario, in parallel parts. The smoke
# set is there because a UI change broke catalogUi and death on main and
# only the next night said so.
#
# Nothing here needs a provider account or a secret: the browsers run
# against the mock server, and the token only reads.
#
# Beside this: freshness.yml (what is pinned by hand against its makers'
# latest), dependency-graph.yml (the one job that writes to the
# repository), codeql.yml. What several jobs share is in .github/actions/.
#
# The visual check (dev/visualcheck.mjs) is not run here: its reference
# pictures are made on macOS and differ wherever text is rendered by another
# system's fonts. Run it locally before a release.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      scenarios:
        description: 'Browser scenarios to run, separated by spaces (empty: all of them)'
        required: false
        default: ''

permissions:
  contents: read

# A newer push to a branch makes the run of the one before it pointless.
# The nightly run and a run on demand are never cancelled.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  # The whole suite: nightly, or on demand with no scenarios chosen.
  WHOLE: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scenarios == '') }}
  # A fixed Chrome for Testing, so that a red run is the code's and not a
  # new Chrome's; dev/freshcheck.mjs reads both lines and says when they
  # have fallen behind. Raise them in a commit of their own.
  CHROME_VERSION: '157.0.8103.38'
  PUPPETEER_BROWSERS_VERSION: '3.2.7'
  TZ: Europe/Helsinki

# Every action is pinned to a commit, with its version beside it: a tag can
# be moved, a commit cannot. Dependabot raises them (.github/dependabot.yml).

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          media: 'true'
      - name: Unit tests
        run: node dev/unitcheck.mjs
      - name: Every name and import resolves
        run: node dev/namecheck.mjs
      - name: The typed modules type-check
        run: node dev/typecheck.mjs
      - name: Markup only from constants, nothing evaluated
        run: node dev/htmlcheck.mjs
      - name: The guides name what exists
        run: node dev/docscheck.mjs
      - name: Area checks
        run: |
          for check in ratingcheck searchnamescheck titlelinkscheck mediafilterscheck moviedurationcheck demuxcheck audiofactscheck; do
            echo "::group::$check"; node "dev/$check.mjs"; echo "::endgroup::"
          done
      - name: Store listings within the stores' limits, _locales in step
        run: node dev/listings.mjs --check
      - name: Every translation of the English as it stands
        run: node dev/translations.mjs --check
      - name: Each language's own term for the core concepts
        run: node dev/glossarycheck.mjs
      - name: The Pages front page rendered from the README
        run: node dev/site.mjs --check
      - name: The two manifests agree
        run: node dev/package.mjs --check
      - name: vendor/ is the reviewed third-party code
        run: node dev/vendorcheck.mjs
      - name: No secrets in the repository
        run: node dev/secretcheck.mjs --all

  # The whole suite takes Chrome some forty minutes in one piece: it runs
  # as three parts side by side (KEPULI_SHARD), every third scenario each.
  # A push's smoke set and chosen scenarios are one part.
  chrome:
    name: Chrome (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON((github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scenarios == '')) && '["1/3","2/3","3/3"]' || '["1/1"]') }}
    env:
      KEPULI_DEV_PORT: '9333'
      KEPULI_DEV_PROFILE: /tmp/kepuli-profile
      KEPULI_LOAD_EXTENSION: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          media: 'true'
      # Branded Chrome on the runner loads the unpacked extension over
      # DevTools but leaves its pages blank. Chrome for Testing is made for
      # this, and still takes --load-extension at start-up.
      - name: Chrome for Testing, from the cache
        id: chrome
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/kepuli-browsers
          key: chrome-for-testing-${{ env.CHROME_VERSION }}
      - name: Chrome for Testing
        run: |
          out=$(npx -y "@puppeteer/browsers@$PUPPETEER_BROWSERS_VERSION" install "chrome@$CHROME_VERSION" --path "$HOME/.cache/kepuli-browsers" | tail -1)
          echo "KEPULI_CHROME=${out#* }" >> "$GITHUB_ENV"
          echo "using ${out#* }"
      # Headless, as on a laptop; in the first part only.
      - name: UI regressions
        if: matrix.shard == '1/1' || matrix.shard == '1/3'
        env:
          KEPULI_HEADLESS: '1'
        run: node dev/uicheck.mjs
      # Runs even when the UI check failed, so one red step does not hide
      # what the scenarios would have said.
      - name: Scenarios (a smoke set on a push, the chosen ones or all otherwise)
        if: success() || failure()
        uses: ./.github/actions/scenarios
        with:
          scenarios: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && 'welcome catalogUi channels home search keys settings death a11y routes remote appback appcast iosapp touchsizes phone' || inputs.scenarios }}
          shard: ${{ env.WHOLE == 'true' && matrix.shard || '' }}

  # The other browser the extension is released for. The same scenarios
  # through Firefox's own driver (firefox/marionette.mjs), which has no
  # headless mode: the virtual screen is what lets it run here at all.
  firefox:
    name: Firefox (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON((github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scenarios == '')) && '["1/2","2/2"]' || '["1/1"]') }}
    env:
      KEPULI_BROWSER: firefox
      KEPULI_FIREFOX_PROFILE: /tmp/kepuli-firefox-profile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          media: 'true'
      - name: Which Firefox
        run: |
          echo "KEPULI_FIREFOX=$(command -v firefox)" >> "$GITHUB_ENV"
          firefox --version
      # ffmpeg whether or not the media came from the cache: Firefox plays
      # H.264 and AAC through the system's libraries, and without them an
      # episode never started.
      #
      # Left out of the whole suite here, each red in this runner's Firefox
      # on 2026-11-18 while green in Firefox on a laptop, and none looked
      # into yet: catalogUi (the covers after two arrows), audio (a script
      # that did not answer in 30 s), phone (History chosen without the
      # focus), arrowmiddle (the related row's arrows), polish (Settings in
      # a window 400 px high), remotescrub (Back on an aim left the full
      # screen, two runs of three). The other scenarios pass. Take a name
      # off the list when its scenario holds here.
      - name: Scenarios (a smoke set on a push, the chosen ones or all otherwise)
        uses: ./.github/actions/scenarios
        with:
          scenarios: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && 'welcome channels home search keys settings routes subtitles' || inputs.scenarios }}
          shard: ${{ env.WHOLE == 'true' && matrix.shard || '' }}
          skip: ${{ env.WHOLE == 'true' && 'catalogUi audio phone arrowmiddle polish remotescrub' || '' }}
          packages: ffmpeg

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # The wrapper's jar is a binary in the repository that runs on every
      # build: it must be one of Gradle's own.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      # The runner has the Android SDK; the build fetches the platform it
      # compiles against by itself once the licences are accepted.
      - name: Accept the Android SDK's licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      # Debug packages: the release ones are signed with a key that is not
      # in the repository. The build runs firefox/build.mjs and
      # android/strings.mjs, so a break in either shows here too.
      - name: Build the phone's and the television's packages, and test the phone's pure rules
        working-directory: android
        run: ./gradlew --no-daemon assembleMobileDebug assembleTvDebug testMobileDebugUnitTest
      - name: What the packages ask Android to allow
        run: node android/permissions.mjs

  # The iPhone and iPad app: the project generated, the app built for the
  # simulator and its XCTest target run. The app's scenarios (ios/simcheck.mjs,
  # a quarter of an hour on two simulators) stay a laptop's.
  ios:
    name: iOS
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: xcodegen
        run: brew install xcodegen
      - name: Which Xcode, which simulators
        run: |
          xcodebuild -version
          # The newest iOS 26 runtime the runner has: the tools name 26.5,
          # which is this project's laptop's.
          runtime=$(xcrun simctl list runtimes -j | node -e 'const r = JSON.parse(require("fs").readFileSync(0, "utf8")).runtimes.filter((x) => x.isAvailable && /iOS-26-/.test(x.identifier)).map((x) => x.identifier.split(".").pop()).sort((a, b) => a.localeCompare(b, undefined, { numeric: true })); console.log(r.at(-1) || "")')
          echo "KEPULI_IOS_RUNTIME=$runtime" >> "$GITHUB_ENV"
          echo "runtime: $runtime"
      - name: Build for the simulator
        run: node ios/build.mjs --simulator
      # Booted first, and tried a second time: on a runner's cold
      # simulator the app's first launch failed once with "the system
      # shell probably crashed", before a test had run.
      - name: XCTest
        run: |
          node ios/sim.mjs devices
          node ios/sim.mjs boot
          node ios/build.mjs --test || { sleep 20; node ios/build.mjs --test; }

  # The one check a branch rule names: green when every job above is, red
  # when any failed or was cancelled. The parts of the browser jobs change
  # name and number with the kind of run; this does not.
  passed:
    name: CI passed
    needs: [static, chrome, firefox, android, ios]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "static, chrome, firefox, android, ios: $RESULTS"
          for result in $RESULTS; do [ "$result" = success ] || exit 1; done

  report:
    name: A red nightly run is reported
    needs: [passed]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - uses: ./.github/actions/report
        with:
          title: The nightly CI is red
